<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blair’s Little Hamster Cottage</title><style>html,body{margin:0;padding:0;background:transparent;overflow-x:hidden}</style></head><body>
<div id="bhc-widget">
<style>
#bhc-widget{--ink:#74534c;--rose:#d89fa9;--pink:#f6dce2;--cream:#fffaf3;font:14px Georgia,serif;color:var(--ink);max-width:240px;margin:auto}#bhc-widget *{box-sizing:border-box}#bhc-widget button,#bhc-widget input{font:inherit}#bhc-widget button{cursor:pointer}#bhc-widget .bhc-cottage{width:100%;border:0;background:transparent;display:block;padding:0;position:relative}#bhc-widget .bhc-cottage svg{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 4px #8b6d6233)}#bhc-widget .bhc-sign{display:block;margin:-22px auto 0;position:relative;width:86%;padding:10px 7px;background:#fff8eb;border:2px solid #c8949b;border-radius:10px;color:#805653;box-shadow:0 3px 0 #dcbfc0;font-weight:bold;font-size:14px;z-index:1}#bhc-widget .bhc-overlay[hidden],#bhc-widget .bhc-screen[hidden]{display:none!important}#bhc-widget .bhc-overlay{position:fixed;inset:0;z-index:9999;background:#392a2b99;display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}#bhc-widget .bhc-dialog{width:100%;max-height:95vh;overflow:auto;background:#fff9f2;border:6px solid #f4d9df;outline:2px solid #fff8f4;border-radius:24px;box-shadow:0 18px 70px #30202055;padding:15px;position:relative}#bhc-widget .bhc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}#bhc-widget .bhc-title{font-size:22px;font-style:italic;margin:0;color:#76524e}#bhc-widget .bhc-close{border:0;border-radius:50%;background:#f5dce1;width:34px;height:34px;font-size:22px;color:#76524e}#bhc-widget .bhc-sub{font-size:12px;text-align:center;color:#9e777a;margin:7px 0 15px}#bhc-widget .bhc-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}#bhc-widget .bhc-choice{border:2px solid #ead4d0;background:white;border-radius:15px;padding:10px 5px;color:#76524e}#bhc-widget .bhc-choice[aria-pressed="true"]{border-color:#bd8898;background:#fbe9ed}#bhc-widget .bhc-choice svg{width:78px;height:66px;display:block;margin:auto}#bhc-widget .bhc-field{display:block;margin:14px 0 5px}#bhc-widget .bhc-input{width:100%;border:1px solid #dfbfc2;border-radius:10px;background:#fff;padding:11px;color:#74534c}#bhc-widget .bhc-mainbtn,#bhc-widget .bhc-action{background:#f3d6dc;border:1px solid #d4aab1;border-radius:12px;padding:10px 12px;color:#74534c}#bhc-widget .bhc-mainbtn{width:100%;margin:14px 0 5px;font-weight:bold}#bhc-widget .bhc-mainbtn:disabled{opacity:.45;cursor:not-allowed}#bhc-widget .bhc-room{position:relative;height:245px;overflow:hidden;border:3px solid #e3b9c2;border-radius:16px;background:repeating-linear-gradient(90deg,#fae5e8 0,#fae5e8 21px,#fcecf0 21px,#fcecf0 42px)}#bhc-widget .bhc-room:before{content:'';position:absolute;bottom:0;left:0;right:0;height:65px;background:repeating-linear-gradient(90deg,#e9cdb7 0,#e9cdb7 29px,#f3ddc9 29px,#f3ddc9 58px);border-top:5px solid #fff8ef}#bhc-widget .bhc-window{position:absolute;top:18px;left:20px;width:74px;height:82px;border:7px solid #fffaf0;border-radius:36px 36px 8px 8px;background:#cce6e5;box-shadow:0 2px 0 #d5a7af}#bhc-widget .bhc-window:after{content:'+';position:absolute;inset:0;text-align:center;font:60px Georgia;color:#fffaf0;line-height:62px}#bhc-widget .bhc-bed{position:absolute;right:15px;bottom:35px;width:108px;height:55px;border-radius:18px 18px 9px 9px;background:#fff3e5;border:5px solid #c99b85;box-shadow:inset 0 -20px #e7b9c6}#bhc-widget .bhc-bed:before{content:'♡';position:absolute;top:3px;left:10px;color:#c88999}#bhc-widget .bhc-bowl{position:absolute;left:20px;bottom:27px;width:51px;height:20px;border-radius:4px 4px 25px 25px;background:#e8a7b1;border:3px solid #fff7ec;text-align:center;line-height:12px}#bhc-widget .bhc-rug{position:absolute;bottom:10px;left:90px;width:160px;height:40px;border-radius:50%;background:#fff3ef99;border:2px dashed #e2b4c1}#bhc-widget .bhc-pet{position:absolute;width:88px;height:76px;left:130px;top:133px;transition:left 1.7s ease-in-out,top 1.7s ease-in-out,transform .35s;z-index:2;filter:drop-shadow(0 3px 2px #73584b33)}#bhc-widget .bhc-pet svg{width:100%;height:100%;overflow:visible}#bhc-widget .bhc-pet.bhc-hop{animation:bhc-hop .45s ease-in-out 2}#bhc-widget .bhc-pet.bhc-sleep{transform:rotate(12deg) scale(.9)}@keyframes bhc-hop{50%{transform:translateY(-15px)}}#bhc-widget .bhc-bubble{position:absolute;top:10px;right:12px;background:#fff9f2e8;border-radius:15px;padding:7px 12px;color:#9c7580;font-size:12px;z-index:3}#bhc-widget .bhc-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}#bhc-widget .bhc-action{padding:9px 3px;font-size:12px}#bhc-widget .bhc-stats{background:#fff;border:1px solid #efd9d7;border-radius:12px;padding:10px;font-size:12px;line-height:1.8}#bhc-widget .bhc-meter{height:9px;background:#f4e6e3;border-radius:12px;overflow:hidden;margin:3px 0 8px}#bhc-widget .bhc-meter span{display:block;height:100%;width:75%;background:#d9a2ac;transition:width .3s}#bhc-widget .bhc-bows{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}#bhc-widget .bhc-bowbtn{border:2px solid transparent;border-radius:50%;width:28px;height:28px;font-size:18px;background:#fff}#bhc-widget .bhc-bowbtn[aria-pressed="true"]{border-color:#a97d8a}#bhc-widget .bhc-foot{font-size:11px;color:#a28581;text-align:center;margin:10px 0 0}#bhc-widget .bhc-smallbtn{border:0;background:none;color:#9d7580;text-decoration:underline;font-size:11px;padding:5px}#bhc-widget .bhc-cert{text-align:center;border:2px dashed #d6abb2;background:#fff;padding:12px;margin:10px 0;border-radius:12px}#bhc-widget .bhc-cert strong{font-size:21px;font-style:italic}#bhc-widget .bhc-toast{min-height:21px;text-align:center;color:#9c7580;font-style:italic;font-size:12px;margin-top:6px}body.bhc-no-scroll{overflow:hidden}@media(max-width:430px){#bhc-widget .bhc-dialog{padding:11px}#bhc-widget .bhc-room{height:225px}#bhc-widget .bhc-title{font-size:19px}}
</style>
<button class="bhc-cottage" id="bhc-open" aria-label="Open hamster cottage">
<svg viewBox="0 0 300 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Little pink cottage with a hamster peeking through the window"><path d="M46 119 L46 246 Q46 257 58 257 L242 257 Q254 257 254 245 L254 119Z" fill="#fff5e9" stroke="#c99ca3" stroke-width="4"/><path d="M24 128 Q19 119 31 106 L135 27 Q150 15 165 27 L269 106 Q282 121 273 128 Q264 137 254 127 Q244 137 234 127 Q224 137 214 127 Q204 137 194 127 Q184 137 174 127 Q164 137 154 127 Q144 137 134 127 Q124 137 114 127 Q104 137 94 127 Q84 137 74 127 Q64 137 54 127 Q40 139 24 128Z" fill="#eebecb" stroke="#c98e9e" stroke-width="4"/><path d="M52 110 L150 38 L248 110" fill="none" stroke="#f9e0e5" stroke-width="6" stroke-dasharray="5 9"/><path d="M105 150 Q105 119 150 119 Q195 119 195 150 L195 218 L105 218Z" fill="#d2e6df" stroke="#bc929b" stroke-width="5"/><path d="M150 122V218 M106 173H194" stroke="#fffaf2" stroke-width="7"/><ellipse cx="150" cy="192" rx="37" ry="29" fill="#f8e5cb" stroke="#ad8d7b" stroke-width="2"/><circle cx="125" cy="166" r="13" fill="#f8e5cb" stroke="#ad8d7b" stroke-width="2"/><circle cx="175" cy="166" r="13" fill="#f8e5cb" stroke="#ad8d7b" stroke-width="2"/><circle cx="138" cy="189" r="3.5" fill="#5b403b"/><circle cx="162" cy="189" r="3.5" fill="#5b403b"/><ellipse cx="150" cy="200" rx="4" ry="3" fill="#c88c96"/><circle cx="125" cy="199" r="6" fill="#eab4b6"/><circle cx="175" cy="199" r="6" fill="#eab4b6"/><path d="M151 160 Q136 148 136 161 Q136 171 151 168 Q167 173 167 161 Q165 150 151 160Z" fill="#d88f9e"/><path d="M151 161L151 174" stroke="#b47686" stroke-width="3"/><path d="M112 220 Q150 230 188 220" fill="none" stroke="#fffaf2" stroke-width="6"/><path d="M66 240q8-16 16 0q8-16 16 0M206 239q8-16 16 0q8-16 16 0" fill="none" stroke="#ca9aa5" stroke-width="3"/><text x="150" y="90" text-anchor="middle" font-family="Georgia" font-size="21" fill="#a06d7c">♡</text><path d="M60 151l8 7-8 7-8-7zM240 151l8 7-8 7-8-7z" fill="#e5a6b6"/></svg>
<span class="bhc-sign" id="bhc-sign">♡ Adopt a Hamster ♡</span></button>
<div class="bhc-overlay" id="bhc-overlay" hidden><section class="bhc-dialog" role="dialog" aria-modal="true" aria-labelledby="bhc-heading"><div class="bhc-top"><h2 class="bhc-title" id="bhc-heading">♡ Little Hamster Cottage</h2><button class="bhc-close" id="bhc-close" aria-label="Close game">×</button></div>
<div class="bhc-screen" id="bhc-adopt"><p class="bhc-sub">Choose your little darling ♡</p><div class="bhc-options" id="bhc-options"></div><label class="bhc-field" for="bhc-name">Your hamster's name</label><input id="bhc-name" class="bhc-input" maxlength="22" placeholder="Mochi, Biscuit, Peaches..."><button class="bhc-mainbtn" id="bhc-adoptbtn" disabled>♡ Adopt My Hamster ♡</button></div>
<div class="bhc-screen" id="bhc-game" hidden><div class="bhc-cert">♡ Adopted with love ♡<br><strong id="bhc-petname">Mochi</strong><br><small id="bhc-petcolor">Vanilla hamster</small></div><div class="bhc-room" id="bhc-room"><div class="bhc-window"></div><div class="bhc-rug"></div><div class="bhc-bed"></div><div class="bhc-bowl">♡</div><div class="bhc-bubble" id="bhc-bubble">♡</div><div class="bhc-pet" id="bhc-pet"></div></div><div class="bhc-toast" id="bhc-toast" aria-live="polite"></div><div class="bhc-actions"><button class="bhc-action" data-action="feed">🍓<br>Feed</button><button class="bhc-action" data-action="pet">💗<br>Pet</button><button class="bhc-action" data-action="play">🧸<br>Play</button><button class="bhc-action" data-action="sleep">🌙<br>Sleep</button></div><div class="bhc-stats">Happiness ♡ <span id="bhc-happylabel">80%</span><div class="bhc-meter"><span id="bhc-happymeter"></span></div>Fullness 🍓 <span id="bhc-foodlabel">70%</span><div class="bhc-meter"><span id="bhc-foodmeter"></span></div><div class="bhc-bows">Bow wardrobe 🎀 <button class="bhc-bowbtn" data-bow="#db8fa8" aria-label="Pink bow">🎀</button><button class="bhc-bowbtn" data-bow="#8cb8d5" aria-label="Blue bow">🩵</button><button class="bhc-bowbtn" data-bow="#b9a0d6" aria-label="Lavender bow">💜</button><button class="bhc-bowbtn" data-bow="#d96c75" aria-label="Red bow">❤️</button></div><div style="margin-top:8px">Adopted: <span id="bhc-date"></span> · Treats: <span id="bhc-treats"></span> · Playtime: <span id="bhc-plays"></span></div></div><p class="bhc-foot"><button class="bhc-smallbtn" id="bhc-reset">Start a new adoption</button></p></div></section></div>
<script>
(function(){
const root=document.getElementById('bhc-widget');if(!root||root.dataset.ready)return;root.dataset.ready='1';const q=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));const key='cozyChroniclesHamsterV1';const colors={Vanilla:{body:'#f7e6cd',patch:''},Honey:{body:'#d9aa6c',patch:'#f3d6a5'},Misty:{body:'#c8c9cf',patch:'#e7e5eb'},Cookie:{body:'#fff0dc',patch:'#bc8b69'}};let chosen='Vanilla',pet=null,walking=null,toastTimer=null;try{pet=JSON.parse(localStorage.getItem(key)||'null');if(!pet||!colors[pet.color]||typeof pet.name!=='string')pet=null}catch(e){pet=null}
function save(){try{localStorage.setItem(key,JSON.stringify(pet))}catch(e){}}
function hamsterSVG(color,bow){let c=colors[color]||colors.Vanilla;return `<svg viewBox="0 0 110 95" xmlns="http://www.w3.org/2000/svg" aria-label="${color} hamster"><ellipse cx="31" cy="24" rx="17" ry="18" fill="${c.body}" stroke="#9d837b" stroke-width="2"/><ellipse cx="79" cy="24" rx="17" ry="18" fill="${c.body}" stroke="#9d837b" stroke-width="2"/><ellipse cx="31" cy="25" rx="9" ry="10" fill="#e9b9ba"/><ellipse cx="79" cy="25" rx="9" ry="10" fill="#e9b9ba"/><ellipse cx="55" cy="55" rx="45" ry="36" fill="${c.body}" stroke="#9d837b" stroke-width="2"/>${c.patch?`<ellipse cx="75" cy="45" rx="17" ry="19" fill="${c.patch}" opacity=".8"/>`:''}<ellipse cx="55" cy="70" rx="24" ry="16" fill="#fff5e9" opacity=".6"/><circle cx="40" cy="51" r="4" fill="#503c39"/><circle cx="70" cy="51" r="4" fill="#503c39"/><circle cx="26" cy="62" r="7" fill="#eaaeb4" opacity=".8"/><circle cx="84" cy="62" r="7" fill="#eaaeb4" opacity=".8"/><path d="M55 61l-4 4 4 3 4-3z" fill="#bb7e87"/><path d="M55 68q-5 8-11 2m11-2q5 8 11 2" stroke="#a37b7a" fill="none" stroke-width="1.5"/><path d="M56 21Q35 7 36 25Q40 35 56 27Q72 35 76 25Q75 7 56 21Z" fill="${bow}" stroke="#aa7886" stroke-width="1.5"/><circle cx="56" cy="24" r="5" fill="${bow}" stroke="#aa7886"/></svg>`}
function renderChoices(){q('#bhc-options').innerHTML=Object.keys(colors).map(n=>`<button class="bhc-choice" type="button" data-color="${n}" aria-pressed="${chosen===n}">${hamsterSVG(n,'#db8fa8')}<span>${n}</span></button>`).join('')}
function update(){q('#bhc-sign').textContent=pet?'♡ Visit '+pet.name+' ♡':'♡ Adopt a Hamster ♡';q('#bhc-adopt').hidden=!!pet;q('#bhc-game').hidden=!pet;if(!pet)return;q('#bhc-petname').textContent=pet.name;q('#bhc-petcolor').textContent=pet.color+' hamster';q('#bhc-pet').innerHTML=hamsterSVG(pet.color,pet.bow);q('#bhc-happylabel').textContent=pet.happy+'%';q('#bhc-foodlabel').textContent=pet.food+'%';q('#bhc-happymeter').style.width=pet.happy+'%';q('#bhc-foodmeter').style.width=pet.food+'%';q('#bhc-date').textContent=pet.date;q('#bhc-treats').textContent=pet.treats;q('#bhc-plays').textContent=pet.plays;all('[data-bow]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bow===pet.bow)));save()}
function move(){if(!pet||q('#bhc-overlay').hidden)return;const room=q('#bhc-room'),node=q('#bhc-pet');const maxX=Math.max(10,room.clientWidth-100);node.style.left=Math.round(10+Math.random()*(maxX-10))+'px';node.style.top=Math.round(119+Math.random()*26)+'px'}
function startWalk(){clearInterval(walking);if(!pet)return;move();walking=setInterval(()=>{if(!pet||pet.sleeping)return;move()},2600)}
function toast(msg){q('#bhc-toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>q('#bhc-toast').textContent='',2800)}
function open(){q('#bhc-overlay').hidden=false;document.body.classList.add('bhc-no-scroll');update();if(pet)startWalk();else setTimeout(()=>q('#bhc-name').focus(),50)}
function close(){q('#bhc-overlay').hidden=true;document.body.classList.remove('bhc-no-scroll');clearInterval(walking);q('#bhc-open').focus()}
q('#bhc-open').addEventListener('click',open);q('#bhc-close').addEventListener('click',close);q('#bhc-overlay').addEventListener('click',e=>{if(e.target===q('#bhc-overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!q('#bhc-overlay').hidden)close()});q('#bhc-options').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(!b)return;chosen=b.dataset.color;renderChoices()});q('#bhc-name').addEventListener('input',()=>q('#bhc-adoptbtn').disabled=!q('#bhc-name').value.trim());q('#bhc-adoptbtn').addEventListener('click',()=>{let name=q('#bhc-name').value.trim().replace(/\s+/g,' ').slice(0,22);if(!name)return;pet={name,color:chosen,bow:'#db8fa8',happy:80,food:70,treats:0,plays:0,date:new Date().toLocaleDateString(),sleeping:false};update();toast('Welcome home, '+name+'! ♡');startWalk()});
all('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(!pet)return;let action=b.dataset.action,node=q('#bhc-pet');if(action==='feed'){pet.food=Math.min(100,pet.food+20);pet.happy=Math.min(100,pet.happy+5);pet.treats++;toast('Yummy strawberries! 🍓')}if(action==='pet'){pet.happy=Math.min(100,pet.happy+12);toast('Happy little squeaks! ♡')}if(action==='play'){pet.happy=Math.min(100,pet.happy+18);pet.food=Math.max(0,pet.food-7);pet.plays++;node.classList.add('bhc-hop');setTimeout(()=>node.classList.remove('bhc-hop'),1000);toast('Playtime! 🧸')}if(action==='sleep'){pet.sleeping=!pet.sleeping;node.classList.toggle('bhc-sleep',pet.sleeping);q('#bhc-bubble').textContent=pet.sleeping?'Z z z':'♡';if(pet.sleeping){node.style.left=Math.max(10,q('#bhc-room').clientWidth-112)+'px';node.style.top='140px';pet.happy=Math.min(100,pet.happy+8);toast('Sweet dreams! 🌙')}else{toast('Good morning! ♡');move()}}if(action!=='sleep'&&pet.sleeping){pet.sleeping=false;node.classList.remove('bhc-sleep');q('#bhc-bubble').textContent='♡'}update()}));all('[data-bow]').forEach(b=>b.addEventListener('click',()=>{if(!pet)return;pet.bow=b.dataset.bow;update();toast('A lovely new bow! 🎀')}));q('#bhc-reset').addEventListener('click',()=>{if(!confirm('Start a new adoption? Your current hamster will be replaced.'))return;pet=null;clearInterval(walking);try{localStorage.removeItem(key)}catch(e){}q('#bhc-name').value='';q('#bhc-adoptbtn').disabled=true;chosen='Vanilla';renderChoices();update()});renderChoices();update();
})();
</script>
</div>

</body></html>
